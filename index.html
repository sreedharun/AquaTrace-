<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AquaTrace! — Sonar Debris Detection &amp; GIS Platform</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- MapTiler tile CDN preconnect — shaves ~100 ms off first tile paint -->
    <link rel="preconnect" href="https://api.maptiler.com">

    <!--
      NOTE: Leaflet CSS is intentionally NOT loaded here.
      It is imported inside the dynamic import() chunk for DetectionMap so it
      only loads when the map is actually rendered (performance rule #3).
      Loading it eagerly here would add render-blocking CSS for every
      page that never shows a map.
    -->
  </head>
  <body class="bg-background text-text antialiased selection:bg-primary-tint">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
